<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vorrat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: eine Spalte wie ein Regal. Gruppen sind Regalböden mit Etikett, Artikel sind Zeilen mit Mengensteuerung rechts. */
:root{
  --bg:#eef1ea; --surface:#ffffff; --ink:#17251d; --muted:#5f6f65; --line:#d5dccf;
  --accent:#1d6b48; --accent-ink:#ffffff; --accent-soft:#dcebe1;
  --warn:#9a5b00; --warn-soft:#fbeccd; --crit:#a8261c; --crit-soft:#f9dedb;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111813; --surface:#1a231d; --ink:#e7eee8; --muted:#97a69c; --line:#2d3a31;
    --accent:#6fcf9d; --accent-ink:#0c1a12; --accent-soft:#213a2c;
    --warn:#f0b65a; --warn-soft:#3b2d12; --crit:#ff8a7d; --crit-soft:#41201c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111813; --surface:#1a231d; --ink:#e7eee8; --muted:#97a69c; --line:#2d3a31;
  --accent:#6fcf9d; --accent-ink:#0c1a12; --accent-soft:#213a2c;
  --warn:#f0b65a; --warn-soft:#3b2d12; --crit:#ff8a7d; --crit-soft:#41201c;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 120px}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:-.02em;margin:0;line-height:1}
.stats{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;margin:6px 0 0}
.stats b{color:var(--ink);font-weight:600}
.stats .soon{color:var(--warn);font-weight:600}
.clear-all{background:none;border:1px solid var(--crit);color:var(--crit);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.clear-all:hover{background:var(--crit-soft)}
.clear-all[disabled]{opacity:.4;cursor:default}
.tools{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.search{flex:1 1 180px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 16px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.note{margin:12px 0 0;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:14px}
.note[hidden]{display:none}

.group{margin-top:22px}
.shelf{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.shelf .label{flex:1;display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;text-align:left;min-width:0}
.shelf .name{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.09em;text-transform:uppercase}
.shelf .count{font-size:12px;font-weight:600;background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.shelf .chev{color:var(--muted);font-size:12px;transition:transform .15s}
.group.closed .chev{transform:rotate(-90deg)}
.shelf .empty-group{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:6px;text-decoration:underline;text-underline-offset:3px}
.shelf .empty-group:hover{color:var(--crit)}
.rows{list-style:none;margin:0;padding:0}
.group.closed .rows{display:none}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.info{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 0}
.info .title{display:block;font-weight:600;overflow-wrap:anywhere}
.info .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:var(--muted);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.qty{display:flex;align-items:center;gap:2px;flex:none}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;display:grid;place-items:center}
.qty .n{min-width:52px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.qty .n small{font-weight:400;color:var(--muted);font-size:12px;margin-left:2px}
.done{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.done:hover{background:var(--accent);color:var(--accent-ink)}
.done svg{width:18px;height:18px}

.blank{margin-top:40px;text-align:center;color:var(--muted)}
.blank h2{font-family:var(--display);font-size:22px;color:var(--ink);margin:0 0 6px;text-wrap:balance}
.blank p{margin:0 auto;max-width:36ch}

.fab{position:fixed;right:max(16px,calc(50% - 324px));bottom:20px;z-index:6;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:14px 22px 14px 18px;font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.fab span{font-size:22px;line-height:1}

.toast{position:fixed;left:16px;right:16px;bottom:84px;z-index:8;max-width:420px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:4px}

.scrim{position:fixed;inset:0;z-index:10;background:rgba(10,18,13,.5);display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px}
.sheet h2{font-family:var(--display);font-size:22px;margin:0}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{background:none;border:0;font-size:15px;color:var(--muted);padding:6px;text-decoration:underline;text-underline-offset:3px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.f input,.f select{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#f-name{font-size:18px;font-weight:600}
.sugg{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;min-height:0}
.sugg button{background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.actions{grid-column:1/-1;display:flex;gap:10px;margin-top:4px}
.primary{flex:1;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:13px;font-weight:600}
.danger{border:1px solid var(--crit);background:none;color:var(--crit);border-radius:999px;padding:13px 18px;font-weight:600}
.danger[hidden]{display:none}
.session{grid-column:1/-1;font-size:14px;color:var(--muted);margin:2px 0 0;font-variant-numeric:tabular-nums}
.session:empty{display:none}
@media (max-width:400px){ h1{font-size:28px} .qty .n{min-width:44px} .qty button{width:30px;height:30px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div>
        <h1>Vorrat</h1>
        <p class="stats" id="stats">Lade Bestand …</p>
      </div>
      <button class="clear-all" id="clear-all" type="button" disabled>Lager leeren</button>
    </div>
    <div class="tools">
      <input class="search" id="search" type="search" placeholder="Suchen …" aria-label="Im Lager suchen" autocomplete="off">
      <div class="seg" role="group" aria-label="Gruppieren nach">
        <button type="button" id="by-loc" aria-pressed="true">Lagerort</button>
        <button type="button" id="by-cat" aria-pressed="false">Kategorie</button>
      </div>
    </div>
    <p class="note" id="note" hidden></p>
  </header>
  <main id="list"></main>
</div>

<button class="fab" id="fab" type="button"><span aria-hidden="true">+</span>Einkauf eintragen</button>

<div class="toast" id="toast" role="status" hidden>
  <span id="toast-text"></span>
  <button type="button" id="undo">Rückgängig</button>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title">Einkauf eintragen</h2>
      <button class="x" id="close" type="button">Fertig</button>
    </div>
    <form id="form" autocomplete="off" novalidate>
      <div class="f wide"><label for="f-name">Artikel</label><input id="f-name" type="text" placeholder="z. B. Milch" enterkeyhint="done" required></div>
      <div class="sugg" id="sugg"></div>
      <div class="f"><label for="f-qty">Menge</label><input id="f-qty" type="text" inputmode="decimal" value="1"></div>
      <div class="f"><label for="f-unit">Einheit</label><select id="f-unit"></select></div>
      <div class="f"><label for="f-loc">Lagerort</label><select id="f-loc"></select></div>
      <div class="f"><label for="f-cat">Kategorie</label><select id="f-cat"></select></div>
      <div class="f"><label for="f-mhd">Haltbar bis</label><input id="f-mhd" type="date"></div>
      <div class="f"><label for="f-price">Preis gesamt (€)</label><input id="f-price" type="text" inputmode="decimal" placeholder="optional"></div>
      <div class="f wide"><label for="f-shop">Geschäft</label><input id="f-shop" type="text" list="shops" placeholder="optional, bleibt für den ganzen Einkauf"><datalist id="shops"></datalist></div>
      <div class="actions">
        <button class="danger" id="f-remove" type="button" hidden>Entfernen</button>
        <button class="primary" id="f-submit" type="submit">Hinzufügen</button>
      </div>
      <p class="session" id="session"></p>
    </form>
  </div>
</div>

<script>
(function(){
"use strict";
var LOCS=["Kühlschrank","Tiefkühler","Vorratsschrank","Keller","Bad","Sonstiges"];
var CATS=["Obst & Gemüse","Milchprodukte & Eier","Fleisch & Fisch","Brot & Backwaren","Trockenware","Konserven & Gläser","Tiefkühlkost","Getränke","Süßes & Snacks","Gewürze & Saucen","Drogerie","Haushalt","Sonstiges"];
var UNITS=["Stk","Pkg","g","kg","ml","l","Dose","Flasche","Glas"];
var LS_KEY="vorrat.local.v1";

var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var str=function(v){return typeof v==="string"?v:""};
var num=function(v){return typeof v==="number"&&isFinite(v)?v:null};
var fmtNum=function(n){return new Intl.NumberFormat("de-AT",{maximumFractionDigits:2}).format(n)};
var fmtEur=function(n){return new Intl.NumberFormat("de-AT",{style:"currency",currency:"EUR"}).format(n)};
function parseNum(s){var n=parseFloat(String(s).trim().replace(/\./g,function(m,i,a){return a.indexOf(",")>-1?"":"."}).replace(",","."));return isFinite(n)?n:null}
function todayISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysUntil(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso))return null;var a=new Date(iso+"T00:00:00"),b=new Date(todayISO()+"T00:00:00");return Math.round((a-b)/864e5)}
function fmtDate(iso){var p=iso.split("-");return p[2]+"."+p[1]+"."}
function productKey(name){var b=new TextEncoder().encode(name.trim().toLowerCase()),h="";for(var i=0;i<b.length&&i<90;i++)h+=b[i].toString(16).padStart(2,"0");return "p"+h}
function newId(){return "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

/* ---------- state ---------- */
var items=[];           // im Lager (status "in")
var products={};        // key -> {name,unit,cat,loc,shop}
var pendingQty={};      // id -> qty (noch nicht geschrieben)
var qtyTimers={};
var groupBy="loc", query="", closed={};
var loaded=false, readOnly=false;
var editId=null, session={count:0,sum:0};
var undoStack=null, toastTimer=null;
try{var pref=JSON.parse(localStorage.getItem("vorrat.ui")||"{}");if(pref.groupBy==="cat")groupBy="cat";closed=pref.closed||{}}catch(e){}
function savePref(){try{localStorage.setItem("vorrat.ui",JSON.stringify({groupBy:groupBy,closed:closed}))}catch(e){}}

/* ---------- store ---------- */
var store=null;
function localStore(){
  var all=[];var prods={};
  try{var raw=JSON.parse(localStorage.getItem(LS_KEY)||"{}");all=raw.items||[];prods=raw.products||{}}catch(e){}
  function push(){try{localStorage.setItem(LS_KEY,JSON.stringify({items:all,products:prods}))}catch(e){}
    items=all.filter(function(i){return i.status==="in"});products=prods;loaded=true;render()}
  return {
    start:push,
    add:function(id,data){all.push(Object.assign({id:id},data));push();return Promise.resolve()},
    patch:function(id,patch){var it=all.find(function(i){return i.id===id});if(it)Object.assign(it,patch);push();return Promise.resolve()},
    product:function(key,data){prods[key]=data;push();return Promise.resolve()}
  };
}
function dbStore(db){
  var chains={};
  function chain(key,fn){var p=(chains[key]||Promise.resolve()).then(fn);chains[key]=p.catch(function(){});return p.catch(onWriteError)}
  return {
    start:function(){
      var timer=setTimeout(function(){note(loaded?"Der Bestand ist vielleicht nicht aktuell, die Verbindung hängt.":"Der Bestand lässt sich gerade nicht laden. Die App versucht es weiter.")},10000);
      db.collection("items").where("status","==","in").onSnapshot(function(snap){
        items=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
        loaded=true;
        if(!snap.metadata.fromCache){clearTimeout(timer);note("")}
        render();
      },function(e){clearTimeout(timer);loaded=true;note("Der Bestand ist nicht mehr erreichbar. Lade die Seite neu, um es erneut zu versuchen.");render()});
      db.collection("products").onSnapshot(function(snap){
        var p={};snap.docs.forEach(function(d){p[d.id]=d.data()});products=p;
      },function(){});
    },
    add:function(id,data){return chain(id,function(){return db.doc("items/"+id).set(data)})},
    patch:function(id,patch){return chain(id,function(){return db.doc("items/"+id).update(patch)})},
    product:function(key,data){return chain("p:"+key,function(){return db.doc("products/"+key).set(data)})}
  };
}
function onWriteError(e){
  if(e&&e.code==="invalid_argument"){readOnly=true;note("Du hast nur Leserechte. Bitte lass dich als Editor einladen, um den Bestand zu ändern.")}
  else if(e&&e.code==="quota_exceeded"){note("Der Speicher der App ist voll. Bitte melde dich, dann räumen wir alte Einträge auf.")}
  else{note("Eine Änderung wurde nicht gespeichert. Bitte versuch es noch einmal.")}
}
function note(text){var n=$("note");n.textContent=text;n.hidden=!text}

/* ---------- derive + render ---------- */
function qtyOf(it){return pendingQty[it.id]!=null?pendingQty[it.id]:(num(it.qty)!=null?it.qty:1)}
function visible(){
  var q=query.trim().toLowerCase();
  return items.filter(function(it){return !q||str(it.name).toLowerCase().indexOf(q)>-1||str(it.shop).toLowerCase().indexOf(q)>-1});
}
function sortRows(a,b){
  var da=daysUntil(str(a.mhd)),dbb=daysUntil(str(b.mhd));
  var sa=da!=null&&da<=3,sb=dbb!=null&&dbb<=3;
  if(sa!==sb)return sa?-1:1;
  if(sa&&sb&&da!==dbb)return da-dbb;
  return str(a.name).localeCompare(str(b.name),"de");
}
function render(){
  var list=$("list");
  var soon=items.filter(function(i){var d=daysUntil(str(i.mhd));return d!=null&&d<=3}).length;
  var worth=items.reduce(function(s,i){return s+(num(i.price)||0)},0);
  var st=$("stats");
  if(!loaded){st.textContent="Lade Bestand …"}
  else{
    st.innerHTML="<b>"+items.length+"</b> Artikel im Lager"+(soon?' · <span class="soon">'+soon+" "+(soon===1?"läuft":"laufen")+" bald ab</span>":"")+(worth?" · Einkaufswert <b>"+esc(fmtEur(worth))+"</b>":"");
  }
  $("clear-all").disabled=!items.length||readOnly;
  $("by-loc").setAttribute("aria-pressed",groupBy==="loc");
  $("by-cat").setAttribute("aria-pressed",groupBy==="cat");
  if(!loaded){list.innerHTML="";return}
  if(!items.length){
    list.innerHTML='<div class="blank"><h2>Das Lager ist leer</h2><p>Trag deinen ersten Einkauf ein. Jeder Artikel landet automatisch hier, sortiert nach Lagerort.</p></div>';
    return;
  }
  var vis=visible();
  if(!vis.length){list.innerHTML='<div class="blank"><h2>Nichts gefunden</h2><p>Kein Artikel passt zu „'+esc(query)+'“.</p></div>';return}
  var order=groupBy==="loc"?LOCS:CATS, groups={};
  vis.forEach(function(it){var g=str(it[groupBy])||"Sonstiges";(groups[g]=groups[g]||[]).push(it)});
  var names=Object.keys(groups).sort(function(a,b){var ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b,"de")});
  var html="";
  names.forEach(function(g){
    var rows=groups[g].sort(sortRows);
    var isClosed=!!closed[groupBy+":"+g]&&!query;
    html+='<section class="group'+(isClosed?" closed":"")+'"><div class="shelf">'+
      '<button type="button" class="label" data-act="toggle" data-g="'+esc(g)+'" aria-expanded="'+(!isClosed)+'"><span class="chev" aria-hidden="true">▼</span><span class="name">'+esc(g)+'</span><span class="count">'+rows.length+'</span></button>'+
      '<button type="button" class="empty-group" data-act="clear-group" data-g="'+esc(g)+'">Gruppe leeren</button></div><ul class="rows">';
    rows.forEach(function(it){
      var meta=[];
      meta.push(esc(groupBy==="loc"?(str(it.cat)||"Sonstiges"):(str(it.loc)||"Sonstiges")));
      var d=daysUntil(str(it.mhd));
      if(d!=null){
        if(d<0)meta.push('<span class="pill crit">abgelaufen seit '+esc(fmtDate(it.mhd))+'</span>');
        else if(d===0)meta.push('<span class="pill warn">läuft heute ab</span>');
        else if(d<=3)meta.push('<span class="pill warn">noch '+d+(d===1?" Tag":" Tage")+'</span>');
        else meta.push("bis "+esc(fmtDate(it.mhd)));
      }
      if(num(it.price)!=null)meta.push(esc(fmtEur(it.price)));
      if(str(it.shop))meta.push(esc(it.shop));
      var id=esc(it.id);
      html+='<li class="row">'+
        '<button type="button" class="info" data-act="edit" data-id="'+id+'"><span class="title">'+esc(str(it.name)||"Ohne Namen")+'</span><span class="meta">'+meta.join("<span aria-hidden=\"true\">·</span>")+'</span></button>'+
        '<div class="qty"><button type="button" data-act="dec" data-id="'+id+'" aria-label="Eins weniger">−</button><span class="n">'+esc(fmtNum(qtyOf(it)))+'<small>'+esc(str(it.unit))+'</small></span><button type="button" data-act="inc" data-id="'+id+'" aria-label="Eins mehr">+</button></div>'+
        '<button type="button" class="done" data-act="remove" data-id="'+id+'" aria-label="'+esc(str(it.name))+' aufgebraucht, entfernen"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5l4 4 8-9"/></svg></button></li>';
    });
    html+="</ul></section>";
  });
  list.innerHTML=html;
}

/* ---------- actions ---------- */
function byId(id){return items.find(function(i){return i.id===id})}
function removeItems(list,label){
  if(!list.length||readOnly)return;
  var now=new Date().toISOString();
  undoStack=list.map(function(it){return {id:it.id,qty:qtyOf(it)}});
  list.forEach(function(it){clearTimeout(qtyTimers[it.id]);delete pendingQty[it.id]});
  runBatch(list.map(function(it){return function(){return store.patch(it.id,{status:"used",removedAt:now})}}));
  showToast(label);
}
function runBatch(jobs){
  var i=0;function next(){if(i>=jobs.length)return Promise.resolve();return Promise.resolve(jobs[i++]()).then(next,next)}
  for(var k=0;k<4;k++)next();
}
function undo(){
  if(!undoStack)return;
  var s=undoStack;undoStack=null;hideToast();
  runBatch(s.map(function(u){return function(){return store.patch(u.id,{status:"in",removedAt:null,qty:u.qty})}}));
}
function showToast(text){
  $("toast-text").textContent=text;$("toast").hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){hideToast();undoStack=null},8000);
}
function hideToast(){clearTimeout(toastTimer);$("toast").hidden=true}
function changeQty(id,delta){
  var it=byId(id);if(!it||readOnly)return;
  var q=Math.round((qtyOf(it)+delta)*100)/100;
  if(q<=0){removeItems([it],"„"+str(it.name)+"“ entfernt");return}
  pendingQty[id]=q;render();
  clearTimeout(qtyTimers[id]);
  qtyTimers[id]=setTimeout(function(){var v=pendingQty[id];if(v==null)return;
    store.patch(id,{qty:v}).then(function(){if(pendingQty[id]===v){delete pendingQty[id];render()}})},500);
}

$("list").addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.dataset.act,id=b.dataset.id,g=b.dataset.g;
  if(act==="inc")changeQty(id,1);
  else if(act==="dec")changeQty(id,-1);
  else if(act==="remove"){var it=byId(id);if(it)removeItems([it],"„"+str(it.name)+"“ entfernt")}
  else if(act==="edit")openSheet(id);
  else if(act==="toggle"){var k=groupBy+":"+g;closed[k]=!closed[k];savePref();render()}
  else if(act==="clear-group"){var l=visible().filter(function(i){return (str(i[groupBy])||"Sonstiges")===g});removeItems(l,l.length+" Artikel aus „"+g+"“ entfernt")}
});
$("clear-all").addEventListener("click",function(){var n=items.length;removeItems(items.slice(),"Lager geleert: "+n+" Artikel entfernt")});
$("undo").addEventListener("click",undo);
$("search").addEventListener("input",function(e){query=e.target.value;render()});
$("by-loc").addEventListener("click",function(){groupBy="loc";savePref();render()});
$("by-cat").addEventListener("click",function(){groupBy="cat";savePref();render()});

/* ---------- Erfassen / Bearbeiten ---------- */
function fill(sel,opts,val){sel.innerHTML=opts.map(function(o){return "<option>"+esc(o)+"</option>"}).join("");if(val&&opts.indexOf(val)<0){var o=document.createElement("option");o.textContent=val;sel.appendChild(o)}if(val)sel.value=val}
function resetForm(keepShop){
  $("f-name").value="";$("f-qty").value="1";$("f-mhd").value="";$("f-price").value="";
  fill($("f-unit"),UNITS,"Stk");fill($("f-loc"),LOCS,"Vorratsschrank");fill($("f-cat"),CATS,"Sonstiges");
  if(!keepShop)$("f-shop").value="";
  $("sugg").innerHTML="";
}
function openSheet(id){
  editId=id||null;
  var shops={};Object.keys(products).forEach(function(k){var s=str(products[k].shop);if(s)shops[s]=1});
  $("shops").innerHTML=Object.keys(shops).map(function(s){return '<option value="'+esc(s)+'">'}).join("");
  if(editId){
    var it=byId(editId);if(!it)return;
    $("sheet-title").textContent="Artikel bearbeiten";$("f-submit").textContent="Speichern";$("f-remove").hidden=false;$("close").textContent="Abbrechen";
    resetForm(false);
    $("f-name").value=str(it.name);$("f-qty").value=fmtNum(qtyOf(it)).replace(/\s/g,"");
    fill($("f-unit"),UNITS,str(it.unit)||"Stk");fill($("f-loc"),LOCS,str(it.loc)||"Sonstiges");fill($("f-cat"),CATS,str(it.cat)||"Sonstiges");
    $("f-mhd").value=str(it.mhd);$("f-price").value=num(it.price)!=null?String(it.price).replace(".",","):"";$("f-shop").value=str(it.shop);
    $("session").textContent="";
  }else{
    $("sheet-title").textContent="Einkauf eintragen";$("f-submit").textContent="Hinzufügen";$("f-remove").hidden=true;$("close").textContent="Fertig";
    session={count:0,sum:0,id:newId()};
    resetForm(true);$("session").textContent="";
  }
  $("scrim").hidden=false;
  if(!editId)$("f-name").focus();
}
function closeSheet(){$("scrim").hidden=true;editId=null;$("fab").focus()}
$("fab").addEventListener("click",function(){openSheet(null)});
$("close").addEventListener("click",closeSheet);
$("scrim").addEventListener("click",function(e){if(e.target===$("scrim"))closeSheet()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("scrim").hidden)closeSheet()});

$("f-name").addEventListener("input",function(){
  if(editId)return;
  var q=$("f-name").value.trim().toLowerCase(),box=$("sugg");
  if(q.length<2){box.innerHTML="";return}
  var hits=Object.keys(products).map(function(k){return products[k]}).filter(function(p){return str(p.name).toLowerCase().indexOf(q)>-1})
    .sort(function(a,b){var x=str(a.name).toLowerCase().indexOf(q),y=str(b.name).toLowerCase().indexOf(q);return x-y||str(a.name).localeCompare(str(b.name),"de")}).slice(0,6);
  box.innerHTML=hits.map(function(p){return '<button type="button" data-p="'+esc(productKey(str(p.name)))+'">'+esc(p.name)+'</button>'}).join("");
});
$("sugg").addEventListener("click",function(e){
  var b=e.target.closest("[data-p]");if(!b)return;var p=products[b.dataset.p];if(!p)return;
  $("f-name").value=str(p.name);fill($("f-unit"),UNITS,str(p.unit)||"Stk");fill($("f-loc"),LOCS,str(p.loc)||"Vorratsschrank");fill($("f-cat"),CATS,str(p.cat)||"Sonstiges");
  $("sugg").innerHTML="";$("f-name").focus();
});
$("f-remove").addEventListener("click",function(){var it=byId(editId);closeSheet();if(it)removeItems([it],"„"+str(it.name)+"“ entfernt")});

$("form").addEventListener("submit",function(e){
  e.preventDefault();
  if(readOnly)return;
  var name=$("f-name").value.trim();
  if(!name){$("f-name").focus();return}
  var qty=parseNum($("f-qty").value);if(qty==null||qty<=0)qty=1;
  var price=parseNum($("f-price").value);if(price!=null&&price<0)price=null;
  var data={name:name.slice(0,80),qty:qty,unit:$("f-unit").value,loc:$("f-loc").value,cat:$("f-cat").value,mhd:$("f-mhd").value||null,price:price,shop:$("f-shop").value.trim().slice(0,60)||null};
  if(editId){
    clearTimeout(qtyTimers[editId]);delete pendingQty[editId];
    store.patch(editId,data);
    store.product(productKey(name),{name:data.name,unit:data.unit,loc:data.loc,cat:data.cat,shop:data.shop});
    closeSheet();return;
  }
  var same=items.find(function(i){return str(i.name).toLowerCase()===name.toLowerCase()&&str(i.loc)===data.loc&&(str(i.mhd)||null)===data.mhd&&str(i.unit)===data.unit});
  if(same){
    var patch={qty:Math.round((qtyOf(same)+qty)*100)/100,shop:data.shop||same.shop||null};
    if(price!=null)patch.price=Math.round(((num(same.price)||0)+price)*100)/100;
    clearTimeout(qtyTimers[same.id]);delete pendingQty[same.id];
    store.patch(same.id,patch);
  }else{
    store.add(newId(),Object.assign({status:"in",removedAt:null,boughtAt:new Date().toISOString(),purchase:session.id},data));
  }
  store.product(productKey(name),{name:data.name,unit:data.unit,loc:data.loc,cat:data.cat,shop:data.shop});
  session.count++;session.sum+=price||0;
  $("session").textContent="In diesem Einkauf: "+session.count+" Artikel"+(session.sum?" · "+fmtEur(session.sum):"")+". Zuletzt: "+data.name;
  resetForm(true);$("f-name").focus();
});

/* ---------- boot ---------- */
render();
function useLocal(msg){store=localStore();store.start();if(msg)note(msg)}
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("db").then(function(db){
    if(db){store=dbStore(db);store.start()}
    else useLocal("Der gemeinsame Bestand ist hier nicht verfügbar. Änderungen bleiben nur auf diesem Gerät.");
  },function(){useLocal("Der gemeinsame Bestand ist hier nicht verfügbar. Änderungen bleiben nur auf diesem Gerät.")});
}else{
  useLocal("");
}
})();
</script>
